                allQuestions.push(q(`Вопрос ${allQuestions.length + 1}: Является ли квадрат параллелограммом?`, ['Да', 'Нет', 'Только если стороны равны']));
            }
        }

        // Перемешаем вопросы для разнообразия? Нет, нужно сгруппировать по 5 для вариантов.
        // Но можно использовать как есть, просто разбить по 5.
        // Однако чтобы варианты не повторялись, оставим порядок и будем выдавать по 5.
        // Если вопросов больше 165, возьмём первые 165.
        const finalQuestions = allQuestions.slice(0, 165);

        // Разбиваем на 33 варианта по 5 вопросов
        const variants = [];
        for (let i = 0; i < 33; i++) {
            const start = i * 5;
            const end = start + 5;
            variants.push(finalQuestions.slice(start, end));
        }

        // Генерация HTML
        const grid = document.getElementById('variantsGrid');
        let html = '';

        variants.forEach((variantQuestions, idx) => {
            const variantNumber = idx + 1;
            html += `<div class="variant-card">`;
            html += `<div class="variant-header">Вариант ${variantNumber}</div>`;
            variantQuestions.forEach((q, qIdx) => {
                html += `<div class="question-item">`;
                html += `<div class="q-text"><span class="q-num">${qIdx + 1}.</span> ${q.text}</div>`;
                if (q.options && q.options.length) {
                    html += `<ul class="options">`;
                    q.options.forEach(opt => {
                        html += `<li>${opt}</li>`;
                    });
                    html += `</ul>`;
                }
                // Не показываем правильный ответ
                html += `</div>`;
            });
            html += `</div>`;
        });

        grid.innerHTML = html;
    </script>
</body>
</html>
