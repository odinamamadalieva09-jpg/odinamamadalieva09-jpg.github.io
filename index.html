<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по геометрии 8 класс: четырёхугольники (10 вариантов)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 20px;
            color: #1e2b3c;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 8px;
            color: #0b3d5f;
            letter-spacing: 0.5px;
        }
        .subhead {
            text-align: center;
            font-size: 1.05rem;
            margin-bottom: 40px;
            color: #3f5e7a;
            border-bottom: 2px solid #cfddee;
            padding-bottom: 16px;
        }
        .variants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }
        .variant-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 20, 40, 0.08);
            padding: 18px 20px 20px 20px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            border: 1px solid #e2edf7;
            display: flex;
            flex-direction: column;
        }
        .variant-card:hover {
            box-shadow: 0 12px 24px rgba(0, 40, 80, 0.12);
            border-color: #b8d4f0;
        }
        .variant-header {
            font-weight: 700;
            font-size: 1.3rem;
            color: #1d5e8f;
            margin-bottom: 14px;
            border-left: 6px solid #1d5e8f;
            padding-left: 14px;
            letter-spacing: 0.3px;
        }
        .question-item {
            margin-bottom: 14px;
            padding-left: 6px;
            border-bottom: 1px dashed #d8e5f0;
            padding-bottom: 10px;
        }
        .question-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .q-text {
            font-weight: 600;
            font-size: 0.98rem;
            color: #1a3e5c;
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
        }
        .q-num {
            color: #2277aa;
            flex-shrink: 0;
        }
        .options {
            margin-top: 5px;
            padding-left: 22px;
            font-size: 0.9rem;
            color: #305a78;
            list-style-type: none;
        }
        .options li {
            margin-bottom: 3px;
            display: flex;
            gap: 6px;
        }
        .options li::before {
            content: "•";
            color: #4f8bb9;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1;
        }
        .footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.9rem;
            color: #6c8ca8;
            border-top: 1px solid #cdddec;
            padding-top: 20px;
        }
        @media (max-width: 600px) {
            body { padding: 16px 12px; }
            h1 { font-size: 1.6rem; }
            .variants-grid { grid-template-columns: 1fr; }
        }
        @media print {
            body { background: white; padding: 10px; }
            .variant-card { box-shadow: none; border: 1px solid #aaa; break-inside: avoid; }
            .variants-grid { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Геометрия 8 класс · Четырёхугольники</h1>
        <div class="subhead">10 вариантов по 5 теоретических вопросов: определения, свойства, признаки</div>
        <div class="variants-grid" id="variantsGrid"></div>
        <div class="footer">Всего 10 вариантов · 50 вопросов · только теория: параллелограмм, трапеция, ромб, квадрат, прямоугольник</div>
    </div>

    <script>
        // 50 теоретических вопросов без осей симметрии, без вычислений, только по указанным фигурам.
        // Каждый вопрос с тремя вариантами ответа (правильный не выделяем).

        const questions = [
            // Вариант 1
            { text: 'Что называется параллелограммом?', options: [
                'Четырёхугольник, у которого противоположные стороны попарно параллельны',
                'Четырёхугольник, у которого все стороны равны',
                'Четырёхугольник, у которого диагонали равны'
            ]},
            { text: 'Какое из следующих свойств НЕ является свойством параллелограмма?', options: [
                'Диагонали равны',
                'Противоположные стороны равны',
                'Противоположные углы равны'
            ]},
            { text: 'Если в четырёхугольнике две стороны равны и параллельны, то этот четырёхугольник:', options: [
                'параллелограмм',
                'трапеция',
                'ромб'
            ]},
            { text: 'Что называется трапецией?', options: [
                'Четырёхугольник, у которого две стороны параллельны, а две другие не параллельны',
                'Четырёхугольник, у которого все стороны параллельны',
                'Четырёхугольник, у которого противоположные стороны равны'
            ]},
            { text: 'Какая трапеция называется равнобедренной?', options: [
                'Трапеция, у которой боковые стороны равны',
                'Трапеция, у которой основания равны',
                'Трапеция, у которой диагонали равны'
            ]},
            // Вариант 2
            { text: 'Что называется ромбом?', options: [
                'Параллелограмм, у которого все стороны равны',
                'Прямоугольник, у которого все стороны равны',
                'Четырёхугольник, у которого диагонали перпендикулярны'
            ]},
            { text: 'Какое свойство диагоналей ромба является верным?', options: [
                'Диагонали взаимно перпендикулярны и делят углы пополам',
                'Диагонали равны',
                'Диагонали параллельны сторонам'
            ]},
            { text: 'Что называется квадратом?', options: [
                'Прямоугольник, у которого все стороны равны',
                'Ромб, у которого все углы прямые',
                'Оба варианта верны'
            ]},
            { text: 'Что называется прямоугольником?', options: [
                'Параллелограмм, у которого все углы прямые',
                'Четырёхугольник, у которого все углы прямые',
                'Трапеция, у которой два угла прямые'
            ]},
            { text: 'Какое свойство диагоналей прямоугольника верно?', options: [
                'Диагонали равны',
                'Диагонали перпендикулярны',
                'Диагонали делят углы пополам'
            ]},
            // Вариант 3
            { text: 'Чему равна сумма углов параллелограмма, прилежащих к одной стороне?', options: [
                '180°',
                '90°',
                '360°'
            ]},
            { text: 'В параллелограмме диагонали точкой пересечения делятся:', options: [
                'Пополам',
                'В отношении 1:2',
                'В отношении 2:1'
            ]},
            { text: 'Если в четырёхугольнике противоположные стороны попарно равны, то это:', options: [
                'параллелограмм',
                'прямоугольник',
                'квадрат'
            ]},
            { text: 'Как называются параллельные стороны трапеции?', options: [
                'Основаниями',
                'Боковыми сторонами',
                'Диагоналями'
            ]},
            { text: 'В равнобедренной трапеции углы при основании:', options: [
                'равны',
                'в сумме дают 90°',
                'различны'
            ]},
            // Вариант 4
            { text: 'Является ли ромб параллелограммом?', options: [
                'Да, всегда',
                'Нет, только если углы прямые',
                'Нет, ромб — это трапеция'
            ]},
            { text: 'Если в параллелограмме диагонали перпендикулярны, то это:', options: [
                'ромб',
                'прямоугольник',
                'квадрат'
            ]},
            { text: 'Является ли квадрат ромбом?', options: [
                'Да, квадрат — это ромб с прямыми углами',
                'Нет, квадрат — это прямоугольник',
                'Нет, квадрат и ромб — разные фигуры'
            ]},
            { text: 'Является ли прямоугольник параллелограммом?', options: [
                'Да, всегда',
                'Нет, только если стороны равны',
                'Нет, прямоугольник — это трапеция'
            ]},
            { text: 'Если в параллелограмме диагонали равны, то это:', options: [
                'прямоугольник',
                'ромб',
                'квадрат'
            ]},
            // Вариант 5
            { text: 'Если диагонали четырёхугольника пересекаются и точкой пересечения делятся пополам, то это:', options: [
                'параллелограмм',
                'трапеция',
                'произвольный четырёхугольник'
            ]},
            { text: 'Диагонали равнобедренной трапеции:', options: [
                'равны',
                'перпендикулярны',
                'делятся точкой пересечения в отношении 1:2'
            ]},
            { text: 'Если в параллелограмме диагонали делят углы пополам, то это:', options: [
                'ромб',
                'прямоугольник',
                'трапеция'
            ]},
            { text: 'Может ли ромб иметь прямые углы?', options: [
                'Да, тогда это квадрат',
                'Нет, у ромба не бывает прямых углов',
                'Да, тогда это прямоугольник, но не квадрат'
            ]},
            { text: 'Является ли квадрат прямоугольником?', options: [
                'Да, квадрат — это прямоугольник с равными сторонами',
                'Нет, квадрат — это ромб',
                'Нет, квадрат и прямоугольник — разные фигуры'
            ]},
            // Вариант 6
            { text: 'Какой четырёхугольник НЕ является параллелограммом?', options: [
                'Трапеция, у которой боковые стороны не параллельны',
                'Ромб',
                'Прямоугольник'
            ]},
            { text: 'Могут ли диагонали параллелограмма быть равными?', options: [
                'Да, если это прямоугольник',
                'Нет, никогда',
                'Да, только если это ромб'
            ]},
            { text: 'Является ли четырёхугольник параллелограммом, если сумма его противоположных углов равна 180°?', options: [
                'Да, это признак параллелограмма',
                'Нет, это признак трапеции',
                'Нет, это признак ромба'
            ]},
            { text: 'Может ли трапеция иметь два прямых угла?', options: [
                'Да, прямоугольная трапеция',
                'Нет, только один прямой угол',
                'Нет, трапеция не может иметь прямых углов'
            ]},
            { text: 'Какая трапеция называется прямоугольной?', options: [
                'Трапеция, у которой одна боковая сторона перпендикулярна основаниям',
                'Трапеция, у которой диагонали перпендикулярны',
                'Трапеция, у которой все углы прямые'
            ]},
            // Вариант 7
            { text: 'Если в параллелограмме все стороны равны, то это:', options: [
                'ромб',
                'квадрат',
                'прямоугольник'
            ]},
            { text: 'Если в параллелограмме все углы прямые, то это:', options: [
                'прямоугольник',
                'ромб',
                'квадрат'
            ]},
            { text: 'Если в параллелограмме все стороны равны и все углы прямые, то это:', options: [
                'квадрат',
                'ромб',
                'прямоугольник'
            ]},
            { text: 'Если в трапеции диагонали равны, то она:', options: [
                'равнобедренная',
                'прямоугольная',
                'произвольная'
            ]},
            { text: 'Если в трапеции углы при одном основании равны, то она:', options: [
                'равнобедренная',
                'прямоугольная',
                'не существует'
            ]},
            // Вариант 8
            { text: 'Является ли трапеция параллелограммом?', options: [
                'Нет, только если боковые стороны параллельны',
                'Да, всегда',
                'Да, если основания равны'
            ]},
            { text: 'Средняя линия трапеции параллельна основаниям и равна:', options: [
                'полусумме оснований',
                'сумме оснований',
                'полуразности оснований'
            ]},
            { text: 'В ромбе диагонали делят его на:', options: [
                'четыре равных прямоугольных треугольника',
                'два равных треугольника',
                'четыре равносторонних треугольника'
            ]},
            { text: 'Диагонали квадрата:', options: [
                'равны, перпендикулярны и делят углы пополам',
                'равны, но не перпендикулярны',
                'перпендикулярны, но не равны'
            ]},
            { text: 'Какое из утверждений о квадрате верно?', options: [
                'Квадрат обладает всеми свойствами параллелограмма, прямоугольника и ромба',
                'Квадрат обладает только свойствами прямоугольника',
                'Квадрат обладает только свойствами ромба'
            ]},
            // Вариант 9
            { text: 'Если в ромбе один угол прямой, то это:', options: [
                'квадрат',
                'прямоугольник',
                'трапеция'
            ]},
            { text: 'Если в прямоугольнике смежные стороны равны, то это:', options: [
                'квадрат',
                'ромб',
                'параллелограмм общего вида'
            ]},
            { text: 'Может ли прямоугольник быть ромбом?', options: [
                'Да, если все стороны равны, тогда это квадрат',
                'Нет, прямоугольник и ромб несовместимы',
                'Да, всегда'
            ]},
            { text: 'Является ли квадрат параллелограммом?', options: [
                'Да, всегда',
                'Нет, только если стороны равны',
                'Нет, квадрат — это трапеция'
            ]},
            { text: 'Верно ли, что любой квадрат является ромбом?', options: [
                'Да',
                'Нет',
                'Только если стороны равны'
            ]},
            // Вариант 10
            { text: 'Верно ли, что любой ромб является квадратом?', options: [
                'Нет',
                'Да',
                'Только если углы прямые'
            ]},
            { text: 'Верно ли, что любой прямоугольник является параллелограммом?', options: [
                'Да',
                'Нет',
                'Только если стороны равны'
            ]},
            { text: 'Верно ли, что любой параллелограмм является прямоугольником?', options: [
                'Нет',
                'Да',
                'Только если диагонали равны'
            ]},
            { text: 'У какой фигуры диагонали равны и перпендикулярны?', options: [
                'Квадрат',
                'Прямоугольник',
                'Ромб'
            ]},
            { text: 'У какой фигуры диагонали равны, но не перпендикулярны?', options: [
                'Прямоугольник',
                'Ромб',
                'Квадрат'
            ]}
        ];

        // Проверка: должно быть 50 вопросов
        // Разбиваем на 10 вариантов по 5
        const variants = [];
        for (let i = 0; i < 10; i++) {
            variants.push(questions.slice(i * 5, i * 5 + 5));
        }

        // Генерация HTML
        const grid = document.getElementById('variantsGrid');
        let html = '';

        variants.forEach((variantQuestions, idx) => {
            const variantNumber = idx + 1;
            html += `<div class="variant-card">`;
            html += `<div class="variant-header">Вариант ${variantNumber}</div>`;
            variantQuestions.forEach((q, qIdx) => {
                html += `<div class="question-item">`;
                html += `<div class="q-text"><span class="q-num">${qIdx + 1}.</span> ${q.text}</div>`;
                if (q.options && q.options.length) {
                    html += `<ul class="options">`;
                    q.options.forEach(opt => {
                        html += `<li>${opt}</li>`;
                    });
                    html += `</ul>`;
                }
                html += `</div>`;
            });
            html += `</div>`;
        });

        grid.innerHTML = html;
    </script>
</body>
</html>
